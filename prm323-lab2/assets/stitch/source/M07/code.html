<script>
  // DOM Elements
  const hobbyNameInput = document.getElementById('hobby-name');
  const charCounter = document.getElementById('char-counter');
  const nameHint = document.getElementById('name-hint');
  const btnCreateHobby = document.getElementById('btn-create-hobby');
  const toastNotification = document.getElementById('toast-notification');
  const toastMessage = document.getElementById('toast-message');
  const toastIcon = document.getElementById('toast-icon');

  // Character counter and validation microcopy
  hobbyNameInput.addEventListener('input', (e) => {
    const len = e.target.value.length;
    charCounter.textContent = `${len}/40`;
    if (len >= 38) {
      charCounter.classList.add('text-error');
      charCounter.classList.remove('text-tertiary');
    } else {
      charCounter.classList.remove('text-error');
      charCounter.classList.add('text-tertiary');
    }
    if (len > 0) {
      nameHint.innerHTML = '<span class="material-symbols-outlined text-[13px]">check_circle</span> Tên sở thích hợp lệ.';
      nameHint.className = 'font-caption text-caption text-secondary flex items-center gap-1 mt-0.5';
    } else {
      nameHint.innerHTML = '<span class="material-symbols-outlined text-[13px]">info</span> Tên ngắn gọn, tối đa 40 ký tự giúp bạn dễ ghi nhớ.';
      nameHint.className = 'font-caption text-caption text-tertiary flex items-center gap-1 mt-0.5';
    }
  });

  // Category selection handler
  const categoryChips = document.querySelectorAll('.category-chip');
  categoryChips.forEach(chip => {
    chip.addEventListener('click', () => {
      categoryChips.forEach(c => {
        c.className = 'category-chip flex items-center gap-1.5 px-3 py-2 rounded-full font-label-sm text-label-sm transition-all bg-surface-container-high text-on-surface hover:bg-surface-variant';
      });
      chip.className = 'category-chip active flex items-center gap-1.5 px-3 py-2 rounded-full font-label-sm text-label-sm transition-all bg-secondary text-on-secondary shadow-sm';
    });
  });

  // Icon selector
  const iconButtons = document.querySelectorAll('.icon-btn');
  iconButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      iconButtons.forEach(b => {
        b.className = 'icon-btn flex items-center justify-center w-11 h-11 rounded-[14px] bg-surface-container-low text-tertiary transition-all hover:bg-surface-container';
      });
      btn.className = 'icon-btn active flex items-center justify-center w-11 h-11 rounded-[14px] bg-secondary-container text-on-secondary-container transition-all';
    });
  });

  // Color picker
  const colorButtons = document.querySelectorAll('.color-btn');
  colorButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      colorButtons.forEach(b => {
        b.classList.remove('scale-110');
        const check = b.querySelector('.check-indicator');
        if (check) check.classList.add('hidden');
      });
      btn.classList.add('scale-110');
      const activeCheck = btn.querySelector('.check-indicator');
      if (activeCheck) activeCheck.classList.remove('hidden');
    });
  });

  // Target tabs
  const tabTime = document.getElementById('tab-time');
  const tabUnit = document.getElementById('tab-unit');
  const targetValueInput = document.getElementById('target-value');

  tabTime.addEventListener('click', () => {
    tabTime.className = 'target-tab active py-2 text-center rounded-[10px] font-label-sm text-label-sm transition-all bg-surface-container-lowest text-secondary font-semibold shadow-xs';
    tabUnit.className = 'target-tab py-2 text-center rounded-[10px] font-label-sm text-label-sm transition-all text-tertiary font-medium';
    targetValueInput.value = '30 phút mỗi ngày';
  });

  tabUnit.addEventListener('click', () => {
    tabUnit.className = 'target-tab active py-2 text-center rounded-[10px] font-label-sm text-label-sm transition-all bg-surface-container-lowest text-secondary font-semibold shadow-xs';
    tabTime.className = 'target-tab py-2 text-center rounded-[10px] font-label-sm text-label-sm transition-all text-tertiary font-medium';
    targetValueInput.value = '10 trang sách mỗi ngày';
  });

  // Weekday multiselect
  const dayChips = document.querySelectorAll('.day-chip');
  const daySummary = document.getElementById('day-summary');

  dayChips.forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
      if (chip.classList.contains('active')) {
        chip.className = 'day-chip active flex flex-col items-center justify-center h-10 rounded-[10px] font-label-sm text-label-sm transition-all bg-secondary text-on-secondary';
      } else {
        chip.className = 'day-chip flex flex-col items-center justify-center h-10 rounded-[10px] font-label-sm text-label-sm transition-all bg-surface-container-low text-tertiary hover:bg-surface-container';
      }
      updateDaySummary();
    });
  });

  function updateDaySummary() {
    const activeDays = document.querySelectorAll('.day-chip.active');
    const count = activeDays.length;
    if (count === 7) {
      daySummary.textContent = 'Mỗi ngày (7 ngày)';
    } else if (count === 5 && !document.querySelector('[data-day="T7"]').classList.contains('active') && !document.querySelector('[data-day="CN"]').classList.contains('active')) {
      daySummary.textContent = 'Ngày trong tuần (T2 - T6)';
    } else if (count === 0) {
      daySummary.textContent = 'Chưa chọn ngày nào';
    } else {
      daySummary.textContent = `${count} ngày mỗi tuần`;
    }
  }

  // Pre-fill suggestion handler
  function applySuggestion(name, cat, icon, color, goal) {
    hobbyNameInput.value = name;
    hobbyNameInput.dispatchEvent(new Event('input'));
    
    // Select category
    categoryChips.forEach(c => {
      if (c.getAttribute('data-cat') === cat) {
        c.click();
      }
    });

    // Select icon
    iconButtons.forEach(b => {
      if (b.getAttribute('data-icon') === icon) {
        b.click();
      }
    });

    // Select color
    colorButtons.forEach(cb => {
      if (cb.getAttribute('data-color') === color) {
        cb.click();
      }
    });

    // Goal
    targetValueInput.value = goal;

    showToast(`Đã áp dụng mẫu: "${name}"`, 'success');
  }

  // Toast System
  let toastTimeout;
  function showToast(message, type = 'success') {
    clearTimeout(toastTimeout);
    toastMessage.textContent = message;
    
    if (type === 'success') {
      toastNotification.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 max-w-[340px] w-full px-4 py-3 rounded-[16px] shadow-lg flex items-center gap-3 bg-secondary text-on-secondary opacity-100 translate-y-0 transition-all duration-300 z-50';
      toastIcon.textContent = 'check_circle';
    } else {
      toastNotification.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 max-w-[340px] w-full px-4 py-3 rounded-[16px] shadow-lg flex items-center gap-3 bg-error text-on-error opacity-100 translate-y-0 transition-all duration-300 z-50';
      toastIcon.textContent = 'error';
    }

    toastTimeout = setTimeout(() => {
      toastNotification.classList.remove('opacity-100', 'translate-y-0');
      toastNotification.classList.add('opacity-0', 'pointer-events-none');
    }, 2800);
  }

  // CTA Submit
  btnCreateHobby.addEventListener('click', () => {
    const val = hobbyNameInput.value.trim();
    if (!val) {
      showToast('Vui lòng nhập tên sở thích của bạn!', 'error');
      hobbyNameInput.focus();
      hobbyNameInput.classList.add('bg-error-container/20');
      setTimeout(() => {
        hobbyNameInput.classList.remove('bg-error-container/20');
      }, 1000);
      return;
    }

    showToast('Tạo sở thích thành công! Đang chuyển hướng...', 'success');
    btnCreateHobby.disabled = true;
    btnCreateHobby.classList.add('opacity-80');
    
    // Smooth transition simulation to M08
    setTimeout(() => {
      window.location.hash = '#m08';
    }, 1200);
  });
</script></main></body></html>
