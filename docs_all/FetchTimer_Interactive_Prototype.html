<style>
:root{--primary:#0E8D68;--primaryLight:#D6F2E5;--ink:#131E1C;--muted:#5A6D67;--subtle:#7F978B;--line:#DFE8E3;--bg:#F8FBF7;--surface:#FFF;--mint:#DFF9E9;--green:#146A45;--orange:#B4561E;--peach:#FFF0E2;--radius:18px;--shadow:0 12px 30px rgba(29,37,71,.07)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#E6EAF5;color:var(--ink);font:15px/1.48 'Noto Sans', 'Segoe UI', Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #E2A548;outline-offset:3px}#app{width:min(100%,412px);height:100dvh;min-height:650px;background:var(--bg);margin:auto;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 65px #6E9E7D30}.status{height:28px;background:var(--surface);padding:5px 24px 0;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:11px;flex-shrink:0}.screen{overflow-y:auto;flex:1;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.pad{padding:23px 21px 26px}.space{height:18px}.topline{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:900;font-size:17px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}.brandmark{display:grid;place-items:center;color:#fff;font-weight:900;background:var(--primary);width:35px;height:35px;border-radius:12px;font-size:19px}.eyebrow{text-transform:uppercase;letter-spacing:1.25px;font-size:11px;font-weight:800;color:var(--primary)}h1{font-size:28px;line-height:1.18;letter-spacing:-.9px;margin:13px 0 6px;font-weight:850}h2{font-size:20px;line-height:1.2;margin:0 0 6px;letter-spacing:-.5px}h3{font-size:15px;margin:0;font-weight:800}.muted{color:var(--muted)}.subtle{color:var(--subtle)}.small{font-size:13px}.chip{border-radius:24px;padding:7px 12px;font-size:12px;font-weight:800;background:var(--primaryLight);color:var(--primary);display:inline-flex;align-items:center;gap:5px}.avatar{width:48px;height:48px;border-radius:15px;background:#E7F5E9;display:grid;place-items:center;font-size:21px}.roundbtn{width:48px;height:48px;border:1px solid var(--line);border-radius:15px;background:#fff;display:grid;place-items:center;color:var(--ink);font-size:22px;flex-shrink:0}.hero{margin-top:21px;background:linear-gradient(130deg,#119D78,#0B7355);color:white;padding:21px 20px;border-radius:25px;position:relative;overflow:hidden;box-shadow:0 12px 27px #0e8d6826}.hero:before{content:'';position:absolute;width:180px;height:180px;right:-65px;top:-86px;border-radius:50%;border:28px solid #ffffff19}.hero:after{content:'';position:absolute;width:125px;height:125px;right:-45px;bottom:-80px;border-radius:50%;border:17px solid #ffffff17}.hero h2{font-size:25px;max-width:245px;position:relative;z-index:1}.hero p{font-size:13px;color:#E3FFF1;max-width:243px;position:relative;z-index:1;margin:8px 0 16px}.hero-btn{border:0;border-radius:13px;background:white;color:var(--primary);padding:12px 17px;font-weight:800;position:relative;z-index:1;min-height:48px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.link-btn{background:none;border:0;color:var(--primary);font-size:13px;font-weight:800;min-height:48px}.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}.metric{background:#fff;border:1px solid var(--line);padding:17px;border-radius:18px}.metric b{display:block;font-size:23px;font-weight:850}.metric span{font-size:12px;color:var(--muted)}.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:0 3px 13px #0d184408}.card.clickable{cursor:pointer}.card+.card{margin-top:11px}.itemrow{display:flex;align-items:center;gap:12px}.itemicon{width:48px;height:48px;border-radius:15px;background:var(--primaryLight);display:grid;place-items:center;font-size:23px;flex:none}.itemicon.mint{background:var(--mint)}.itemicon.peach{background:var(--peach)}.itemgrow{flex:1;min-width:0}.itemgrow h3{margin-bottom:2px}.itemgrow p{margin:0;font-size:13px;color:var(--muted)}.arrow{font-weight:900;color:var(--subtle)}.tag{display:inline-flex;gap:5px;align-items:center;border-radius:8px;background:var(--mint);color:var(--green);font-weight:750;padding:5px 8px;font-size:12px}.tag.orange{background:var(--peach);color:var(--orange)}.navbar{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:9px 9px max(10px,env(safe-area-inset-bottom));gap:4px}.navitem{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);min-height:53px;justify-content:center;border-radius:13px;font-size:11px;font-weight:750}.navitem .ni{font-size:22px;line-height:1.2}.navitem.active{color:var(--primary);background:var(--primaryLight)}.backtop{display:flex;align-items:center;gap:14px;margin-bottom:18px}.backtop h2{margin:0}.formlabel{display:block;color:var(--ink);font-size:14px;font-weight:800;margin:21px 0 8px}.field{height:54px;width:100%;border:1.5px solid #A8BEAF;border-radius:14px;background:#fff;padding:0 15px;color:var(--ink);font-size:15px}.field::placeholder{color:#748198}.field.invalid{border-color:#BD3030;background:#FFF7F7}.error-msg{font-size:13px;color:#AD2929;margin-top:6px;font-weight:700}.optiongrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.option{background:white;min-height:72px;border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-size:13px;font-weight:800}.option.active{border-color:var(--primary);background:var(--primaryLight);color:var(--primary)}.option .emoji{font-size:22px}.btn{height:52px;width:100%;display:flex;justify-content:center;align-items:center;gap:9px;border:0;border-radius:15px;background:var(--primary);color:white;font-weight:850;font-size:15px}.btn.secondary{background:var(--primaryLight);color:var(--primary)}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#AB2E39}.btn:disabled{background:#DBDDE8;color:#646E86;cursor:not-allowed}.bottomaction{margin-top:26px}.daystrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:20px 0}.day{background:white;border:1px solid var(--line);border-radius:14px;padding:12px 2px;text-align:center;font-size:12px;color:var(--muted)}.day b{display:block;font-size:19px;color:var(--ink);margin-top:4px}.day.selected{background:var(--primary);color:#fff;border-color:var(--primary)}.day.selected b{color:white}.timeline{display:flex;gap:13px;padding:14px 0;align-items:flex-start}.time{width:51px;font-size:13px;font-weight:800;color:var(--muted);padding-top:6px}.timecard{flex:1;border-left:4px solid var(--primary);padding:12px 14px;background:white;border-radius:0 15px 15px 0;box-shadow:var(--shadow);min-height:81px}.timecard.mint{border-color:#24A373}.timecard p{color:var(--muted);margin:3px 0 0;font-size:12px}.big-icon{display:grid;place-items:center;width:80px;height:80px;border-radius:26px;margin:22px auto 14px;background:var(--primaryLight);font-size:41px}.center{text-align:center}.large-stat{font-size:34px;font-weight:900;letter-spacing:-.8px;color:var(--primary)}.duration{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0}.durb{min-height:70px;background:white;border:1.5px solid var(--line);border-radius:15px;font-size:20px;font-weight:900;color:var(--ink)}.durb small{display:block;font-size:12px;font-weight:600;color:var(--muted)}.durb.selected{color:var(--primary);background:var(--primaryLight);border-color:var(--primary)}.orbit{width:240px;height:240px;margin:27px auto;border-radius:50%;background:conic-gradient(var(--primary) 0 74%,#E9EBF8 74% 100%);display:grid;place-items:center;box-shadow:0 0 0 13px #EFEDFF}.orbit-inner{width:207px;height:207px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.timertext{font-size:43px;font-weight:900;letter-spacing:-1px}.orbit-inner span{color:var(--muted);font-size:13px}.trophy{height:155px;border-radius:25px;background:linear-gradient(125deg,#F9ECCD,#FFEDD6);display:grid;place-items:center;font-size:74px;margin:24px 0}.search{background:#fff;border:1px solid var(--line);height:53px;display:flex;align-items:center;gap:9px;padding:0 15px;border-radius:15px;color:var(--muted);margin:19px 0}.search input{border:0;background:transparent;outline:0;width:100%;color:var(--ink)}.cover{height:121px;border-radius:19px;background:linear-gradient(120deg,#E7E0FF,#CBEFE6);display:grid;place-items:center;font-size:60px;margin-bottom:13px}.member-stack{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--muted)}.members{display:flex;letter-spacing:-5px;font-size:22px;margin-right:10px}.profilehero{padding:25px 16px;background:linear-gradient(135deg,#EEEFFF,#E4F7EE);border-radius:22px;text-align:center}.profile-photo{width:80px;height:80px;background:white;border-radius:26px;display:grid;place-items:center;font-size:38px;margin:0 auto 11px}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:19px}.profile-stats b{font-size:20px;display:block}.profile-stats span{font-size:12px;color:var(--muted)}.modalwrap{position:absolute;inset:0;background:#0A1337A6;display:grid;place-items:end center;z-index:50}.dialog{background:white;width:100%;border-radius:28px 28px 0 0;padding:24px 22px 30px;box-shadow:0 -14px 50px #0001}.dialog h2{margin:0 0 9px}.dialog p{color:var(--muted)}.dual{display:flex;gap:10px}.dual .btn{flex:1}.toast{position:absolute;left:16px;right:16px;top:39px;background:#1B2F45;color:white;z-index:40;border-radius:13px;padding:14px 16px;font-size:13px;box-shadow:0 10px 25px #0003}.loader{width:39px;height:39px;border:4px solid #DED9FF;border-top-color:var(--primary);border-radius:100%;animation:spin .7s linear infinite;margin:110px auto 18px}@keyframes spin{to{transform:rotate(360deg)}}.wirelabel{display:none}.helper{font-size:12px;color:var(--muted);margin-top:8px}.pillrow{display:flex;gap:9px;flex-wrap:wrap}.checkline{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px;margin-top:14px}.checkline .ok{color:var(--green)}
body.wire{--primary:#585858;--primaryLight:#E9E9E9;--ink:#2C2C2C;--muted:#555;--subtle:#777;--line:#AFAFAF;--bg:#F2F2F2;--surface:#FFF;--mint:#E5E5E5;--green:#333;--orange:#555;--peach:#EEE}body.wire .hero,body.wire .trophy,body.wire .cover,body.wire .profilehero{background:#E2E2E2!important;color:#333!important;box-shadow:none}body.wire .hero p{color:#555}body.wire .hero-btn{background:#fff;color:#222;border:1px solid #aaa}body.wire .chip,body.wire .tag{background:#eee;color:#555}body.wire .wirelabel{display:block;position:absolute;right:12px;top:7px;font-size:9px;color:#666;z-index:10;background:#fff;padding:2px 7px;border:1px dashed #999}body.wire .card,body.wire .metric{box-shadow:none}body.wire .orbit{background:conic-gradient(#888 0 74%,#ddd 74%)}
@media(min-width:450px){body{padding:23px}#app{border-radius:28px;height:min(900px,calc(100dvh - 46px))}}@media(max-height:660px){.pad{padding-top:12px}.hero{margin-top:12px}}
</style></head>
<body><main id="app" aria-label="Fetch Timer mobile prototype"><div class="status"><span>9:41</span><span>●●● ︱ ▰</span></div><section id="view" class="screen"></section><nav class="navbar" aria-label="Điều hướng chính"></nav><div id="layers"></div></main>
<script>
const screens={home:'S01 · Trang chủ',create:'S02 · Tạo hoạt động',schedule:'S03 · Lịch trình',detail:'S04 · Chi tiết hoạt động',setup:'S05 · Cài đặt tập trung',timer:'S06 · Phiên tập trung',summary:'S07 · Tổng kết phiên',community:'S08 · Cộng đồng',group:'S09 · Chi tiết nhóm',profile:'S10 · Cá nhân'};
const mode=new URLSearchParams(location.search); if(mode.get('mode')==='wireframe')document.body.classList.add('wire');
const state={current:'home',history:[],modal:'',toast:'',taskName:'',taskTime:'17:30',category:'Đọc sách',duration:25,elapsed:0,ticking:false,joined:false,forceError:false,taskCreated:false};let tickId=null,toastId=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c=(name,more='')=>`<div class="card ${more}">${name}</div>`;
const back=(label)=>`<div class="backtop"><button class="roundbtn" aria-label="Quay lại" data-act="back">‹</button><h2>${label}</h2></div>`;
const taskName=()=>esc(state.taskName||'Đọc sách 20 trang');
const home=()=>`<div class="pad"><div class="topline"><div class="brand"><div class="brandmark">◷</div> fetch timer</div><button class="avatar" aria-label="Mở hồ sơ" data-go="profile">👩🏻‍💻</button></div><div style="margin-top:23px" class="eyebrow">THỨ NĂM · HÔM NAY</div><h1>Mỗi ngày một chút,<br>tiến bộ thật nhiều.</h1><div class="muted">Sẵn sàng cho hành trình sở thích của bạn?</div><div class="hero"><div class="eyebrow" style="color:#D9E2FF">ĐẾN GIỜ TẬP TRUNG</div><h2>Giữ nhịp sáng tạo của bạn ✨</h2><p>Bắt đầu một phiên tập trung và hoàn thành mục tiêu nhỏ hôm nay.</p><button class="hero-btn" data-go="setup">Bắt đầu tập trung →</button></div><div class="metric-row"><div class="metric"><b>2h 15</b><span>⏱ Tập trung tuần này</span></div><div class="metric"><b>🔥 7</b><span>Ngày duy trì liên tiếp</span></div></div><div class="section-title"><h2>Lịch hôm nay</h2><button class="link-btn" data-go="schedule">Xem tất cả →</button></div>${c(`<div class="itemrow"><div class="itemicon">📚</div><div class="itemgrow"><h3>${state.taskCreated?taskName():'Đọc sách 20 trang'}</h3><p>🕒 ${state.taskCreated?esc(state.taskTime):'17:30'} · ${esc(state.category)}</p></div><div class="arrow">›</div></div>`,'clickable" data-go="detail')}${c(`<div class="itemrow"><div class="itemicon mint">🎨</div><div class="itemgrow"><h3>Phác thảo ý tưởng</h3><p>🕒 20:00 · Sáng tạo</p></div><div class="arrow">›</div></div>`,'clickable" data-go="schedule')}<div class="space"></div><button class="btn secondary" data-go="create">＋ Thêm hoạt động mới</button></div>`;
const create=()=>`<div class="pad">${back('Hoạt động mới')}<div class="eyebrow">LÊN KẾ HOẠCH</div><h1>Tạo thời gian cho<br>điều bạn yêu thích.</h1><div class="muted">Bắt đầu bằng một mục tiêu nhỏ, rõ ràng.</div><label class="formlabel" for="taskName">Tên hoạt động *</label><input id="taskName" class="field ${state.forceError?'invalid':''}" value="${esc(state.taskName)}" placeholder="VD: Đọc sách 20 trang" maxlength="48" aria-invalid="${state.forceError}">${state.forceError?'<div class="error-msg" role="alert">Vui lòng nhập tên hoạt động.</div>':''}<div class="formlabel">Chọn sở thích</div><div class="optiongrid">${[['📚','Đọc sách'],['🎨','Sáng tạo'],['🎵','Âm nhạc']].map(([e,n])=>`<button class="option ${state.category===n?'active':''}" data-category="${n}"><span class="emoji">${e}</span>${n}</button>`).join('')}</div><label class="formlabel" for="taskTime">Thời gian nhắc</label><input id="taskTime" class="field" type="time" value="${esc(state.taskTime)}"><div class="helper">🔔 Bạn sẽ được nhắc trước khi đến giờ (mô phỏng).</div><div class="bottomaction"><button class="btn" data-act="save-task">Lưu hoạt động →</button></div></div>`;
const schedule=()=>`<div class="pad"><div class="topline"><div><div class="eyebrow">KẾ HOẠCH CỦA TÔI</div><h1>Lịch trình</h1></div><button class="roundbtn" aria-label="Thêm hoạt động" data-go="create">＋</button></div><div class="daystrip">${[['T2',5],['T3',6],['T4',7],['T5',8],['T6',9]].map(([w,d])=>`<div class="day ${d===8?'selected':''}">${w}<b>${d}</b></div>`).join('')}</div><div class="section-title"><h2>Hôm nay, 08 tháng 10</h2><span class="chip">2 hoạt động</span></div><div class="timeline"><div class="time">${state.taskCreated?esc(state.taskTime):'17:30'}</div><div class="timecard" data-go="detail" role="button" tabindex="0"><h3>📚 ${state.taskCreated?taskName():'Đọc sách 20 trang'}</h3><p>${esc(state.category)} · Nhắc 10 phút trước</p><div style="margin-top:8px"><span class="tag">◷ Sắp diễn ra</span></div></div></div><div class="timeline"><div class="time">20:00</div><div class="timecard mint"><h3>🎨 Phác thảo ý tưởng</h3><p>30 phút · Sáng tạo</p><div style="margin-top:8px"><span class="tag orange">◷ Chưa bắt đầu</span></div></div></div><div class="space"></div><button class="btn" data-go="create">＋ Tạo hoạt động mới</button></div>`;
const detail=()=>`<div class="pad">${back('Chi tiết hoạt động')}<div class="big-icon">📚</div><div class="center"><div class="eyebrow">HOẠT ĐỘNG CỦA BẠN</div><h1>${state.taskCreated?taskName():'Đọc sách 20 trang'}</h1><span class="tag">✓ Đã lên lịch</span></div><div class="space"></div>${c('<div class="itemrow"><div class="itemicon">📆</div><div class="itemgrow"><h3>Thời gian</h3><p>Hôm nay · '+esc(state.taskTime)+'</p></div></div>')}${c('<div class="itemrow"><div class="itemicon mint">🔔</div><div class="itemgrow"><h3>Lời nhắc</h3><p>Trước 10 phút</p></div></div>')}${c('<div class="itemrow"><div class="itemicon peach">🎯</div><div class="itemgrow"><h3>Nhóm sở thích</h3><p>'+esc(state.category)+'</p></div></div>')}<div class="bottomaction"><button class="btn" data-go="setup">Bắt đầu tập trung →</button><div style="height:10px"></div><button class="btn ghost" data-go="schedule">Quay về lịch trình</button></div></div>`;
const setup=()=>`<div class="pad">${back('Thiết lập phiên')}<div class="center"><div class="big-icon">🎧</div><h1>Không xao nhãng.<br>Chỉ bạn và mục tiêu.</h1><div class="muted">Chọn thời lượng phù hợp với nhịp của bạn.</div></div><div class="formlabel">Bạn muốn tập trung bao lâu?</div><div class="duration">${[15,25,45].map(n=>`<button class="durb ${state.duration===n?'selected':''}" data-duration="${n}">${n}<small>phút</small></button>`).join('')}</div>${c('<div class="itemrow"><div class="itemicon mint">🎼</div><div class="itemgrow"><h3>Âm thanh nền</h3><p>Nhạc tập trung · tuỳ chọn</p></div><span class="chip">Demo</span></div>')}${c('<div class="itemrow"><div class="itemicon peach">🔕</div><div class="itemgrow"><h3>Giảm gián đoạn</h3><p>Bật chế độ yên tĩnh trên thiết bị</p></div><span class="chip">Gợi ý</span></div>')}<div class="bottomaction"><button class="btn" data-act="start-timer">Bắt đầu ${state.duration} phút →</button></div><div class="helper center">Bản demo dùng đồng hồ mô phỏng để kiểm tra luồng.</div></div>`;
const fmt=s=>{let t=Math.max(0,state.duration*60-s);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const timer=()=>`<div class="pad">${back('Phiên tập trung')}<div class="center"><div class="eyebrow">ĐANG THEO DÕI PHIÊN</div><h1>Thời gian cho chính mình</h1><p class="muted">Mọi phút tập trung đều đáng giá.</p><div class="orbit"><div class="orbit-inner"><span>CÒN LẠI</span><div id="clock" class="timertext">${fmt(state.elapsed)}</div><span>${state.ticking?'● Đang tập trung':'Ⅱ Đã tạm dừng'}</span></div></div><span class="chip">🎧 Deep Focus · ${state.duration} phút</span></div><div class="space"></div><button class="btn" data-act="toggle-timer">${state.ticking?'Ⅱ Tạm dừng':'▶ Tiếp tục'}</button><div style="height:11px"></div><button class="btn secondary" data-act="finish-timer">✓ Hoàn thành phiên (demo)</button><div style="height:11px"></div><button class="btn ghost" data-act="quit-confirm">Kết thúc sớm</button></div>`;
const summary=()=>`<div class="pad">${back('Tổng kết phiên')}<div class="trophy">🏆</div><div class="center"><div class="eyebrow">BẠN ĐÃ HOÀN THÀNH</div><h1>Một bước nhỏ,<br>một ngày thật tốt!</h1><p class="muted">Bạn vừa dành thời gian có ý nghĩa cho sở thích.</p><div class="large-stat">${state.duration} phút</div><span class="chip">✓ Phiên tập trung thành công</span></div><div class="metric-row"><div class="metric"><b>+1</b><span>Phiên đã hoàn thành</span></div><div class="metric"><b>🔥 8</b><span>Chuỗi ngày (mô phỏng)</span></div></div><div class="bottomaction"><button class="btn" data-go="home">Về trang chủ</button><div style="height:10px"></div><button class="btn secondary" data-go="setup">Thêm phiên tập trung</button></div></div>`;
const community=()=>`<div class="pad"><div class="eyebrow">KẾT NỐI & TRUYỀN CẢM HỨNG</div><h1>Cộng đồng</h1><div class="muted">Đồng hành cùng những người có chung đam mê.</div><div class="search"><span>⌕</span><input id="searchGroup" placeholder="Tìm theo sở thích" aria-label="Tìm nhóm" /></div><div class="section-title"><h2>Nhóm gợi ý</h2><span class="chip">Dành cho bạn</span></div><div class="card clickable" data-go="group"><div class="cover">📚 ✨</div><div class="itemrow"><div class="itemgrow"><h3>Những người yêu sách</h3><p>Chia sẻ hành trình đọc sách mỗi ngày.</p></div><div class="arrow">›</div></div><div class="member-stack"><span class="members">🧑🏻👩🏽👨🏼</span> 1.248 thành viên</div></div><div class="space"></div><div class="card"><div class="cover" style="background:linear-gradient(125deg,#FFEBE4,#E8E8FF)">🎨 🌈</div><h3>Góc sáng tạo mỗi ngày</h3><p class="muted small">985 thành viên · Vẽ và thiết kế</p><button class="btn secondary" data-go="group">Khám phá nhóm →</button></div></div>`;
const group=()=>`<div class="pad">${back('Khám phá nhóm')}<div class="cover" style="height:170px;font-size:76px">📚</div><div class="eyebrow">CỘNG ĐỒNG / ĐỌC SÁCH</div><h1>Những người yêu sách</h1><div class="member-stack"><span class="members">🧑🏻👩🏽👨🏼</span> 1.248 thành viên</div><p class="muted">Cùng chia sẻ câu chuyện, mục tiêu đọc sách và nguồn cảm hứng của bạn mỗi tuần.</p><div class="pillrow"><span class="chip">#Đọc sách</span><span class="chip">#Phát triển bản thân</span></div><div class="section-title"><h2>Hoạt động nổi bật</h2></div>${c('<div class="itemrow"><div class="itemicon mint">📖</div><div class="itemgrow"><h3>Thử thách 15 phút mỗi ngày</h3><p>26 người đang tham gia</p></div></div>')}${c('<div class="itemrow"><div class="itemicon peach">💬</div><div class="itemgrow"><h3>Cuốn sách tuần này</h3><p>Chủ đề thảo luận mới</p></div></div>')}<div class="bottomaction"><button class="btn ${state.joined?'secondary':''}" data-act="join-confirm">${state.joined?'✓ Đã tham gia nhóm':'Tham gia nhóm →'}</button></div></div>`;
const profile=()=>`<div class="pad"><div class="topline"><div><div class="eyebrow">HÀNH TRÌNH CỦA TÔI</div><h1>Hồ sơ</h1></div><button class="roundbtn" data-go="home" aria-label="Trang chủ">⌂</button></div><div class="profilehero"><div class="profile-photo">👩🏻‍💻</div><h2>Minh Anh</h2><div class="muted">Người học hỏi mỗi ngày</div><div class="profile-stats"><div><b>08</b><span>Ngày liên tiếp</span></div><div><b>12</b><span>Phiên focus</span></div><div><b>03</b><span>Sở thích</span></div></div></div><div class="section-title"><h2>Sở thích của tôi</h2></div>${c('<div class="itemrow"><div class="itemicon">📚</div><div class="itemgrow"><h3>Đọc sách</h3><p>4 giờ tuần này</p></div><span class="tag">Đang phát triển</span></div>')}${c('<div class="itemrow"><div class="itemicon mint">🎨</div><div class="itemgrow"><h3>Sáng tạo</h3><p>2 giờ tuần này</p></div></div>')}<div class="space"></div><button class="btn secondary" data-go="community">Khám phá cộng đồng →</button></div>`;
const all={home,create,schedule,detail,setup,timer,summary,community,group,profile};const foot=['home','schedule','community','profile'];
function render(){document.getElementById('view').innerHTML=all[state.current]();document.querySelector('.navbar').innerHTML=foot.map((key,i)=>`<button class="navitem ${(state.current===key||((state.current==='create'||state.current==='detail')&&key==='schedule')||((state.current==='group')&&key==='community'))?'active':''}" data-go="${key}"><span class="ni">${['⌂','▦','♧','♙'][i]}</span>${['Trang chủ','Lịch trình','Cộng đồng','Cá nhân'][i]}</button>`).join('');const layers=document.getElementById('layers');layers.innerHTML=(state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:'')+(state.modal?modalHtml():'');document.getElementById('view').scrollTop=0;}
function go(x,push=true){if(!all[x])return;if(push&&x!==state.current)state.history.push(state.current);state.current=x;state.modal='';render();}
function goback(){if(state.history.length)go(state.history.pop(),false);else go('home',false)}
function notify(str){state.toast=str;clearTimeout(toastId);render();toastId=setTimeout(()=>{state.toast='';const l=document.getElementById('layers');if(l)l.innerHTML=state.modal?modalHtml():''},2400)}
function modalHtml(){const isQuit=state.modal==='quit';const isJoin=state.modal==='join';return `<div class="modalwrap" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-label="${isQuit?'Xác nhận kết thúc phiên':'Xác nhận tham gia nhóm'}"><div class="chip">${isQuit?'XÁC NHẬN':'CỘNG ĐỒNG'}</div><h2 style="margin-top:14px">${isQuit?'Bạn muốn kết thúc sớm?':isJoin?(state.joined?'Bạn đã tham gia nhóm':'Tham gia nhóm này?'):'Đã tham gia'}</h2><p>${isQuit?'Tiến trình phiên hiện tại chưa được tính là hoàn thành. Bạn có thể quay lại tiếp tục.':'Bạn sẽ có thể theo dõi các thử thách và bài chia sẻ trong nhóm.'}</p><div class="dual"><button class="btn ghost" data-act="close-modal">${isQuit?'Tiếp tục':'Hủy'}</button><button class="btn ${isQuit?'danger':''}" data-act="${isQuit?'quit-now':'join-now'}">${isQuit?'Kết thúc':'Xác nhận'}</button></div></div></div>`}
function stopTick(){clearInterval(tickId);tickId=null;state.ticking=false}
function startTick(){stopTick();state.ticking=true;tickId=setInterval(()=>{state.elapsed++;const clock=document.getElementById('clock');if(clock)clock.textContent=fmt(state.elapsed);if(state.elapsed>=state.duration*60){finishTimer()}},1000)}
function finishTimer(){stopTick();state.current='loading';render();setTimeout(()=>go('summary'),650);}
all.loading=()=>'<div class="pad center"><div class="loader"></div><h2>Đang tổng hợp kết quả…</h2><div class="muted">Đồng bộ tiến trình mô phỏng</div></div>';
function handleAction(act){switch(act){case 'back':goback();break;case 'save-task':{const v=document.getElementById('taskName').value.trim();state.taskTime=document.getElementById('taskTime').value||'17:30';state.taskName=v;if(!v){state.forceError=true;render();document.getElementById('taskName').focus();break;}state.forceError=false;state.taskCreated=true;go('schedule');notify('✓ Hoạt động đã được lưu vào lịch');break;}case 'start-timer':state.elapsed=0;go('timer');startTick();render();break;case 'toggle-timer':if(state.ticking)stopTick();else startTick();render();break;case 'finish-timer':stopTick();state.current='loading';render();setTimeout(()=>go('summary'),650);break;case 'quit-confirm':state.modal='quit';render();break;case 'quit-now':stopTick();state.modal='';go('setup');notify('Phiên đã kết thúc sớm');break;case 'join-confirm':state.modal='join';render();break;case 'join-now':state.joined=true;state.modal='';render();notify('✓ Bạn đã tham gia nhóm thành công');break;case 'close-modal':state.modal='';render();break;}}
document.getElementById('app').addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act],[data-category],[data-duration]');if(!el)return;if(el.dataset.go){if(state.current==='timer'&&state.ticking&&el.dataset.go!=='timer')stopTick();go(el.dataset.go)}else if(el.dataset.act)handleAction(el.dataset.act);else if(el.dataset.category){state.category=el.dataset.category;render()}else if(el.dataset.duration){state.duration=+el.dataset.duration;render()}});
document.getElementById('app').addEventListener('input',e=>{if(e.target.id==='taskName'){state.taskName=e.target.value;state.forceError=false;e.target.classList.remove('invalid');const err=document.querySelector('.error-msg');if(err)err.remove()}if(e.target.id==='taskTime')state.taskTime=e.target.value;if(e.target.id==='searchGroup'){document.querySelectorAll('.card').forEach(x=>x.style.opacity=e.target.value.toLowerCase().includes('xyz')?'0.3':'1')}});
document.getElementById('app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-go]')){e.preventDefault();go(e.target.dataset.go)}if(e.key==='Escape'&&state.modal){state.modal='';render()}});
if(mode.get('screen')&&all[mode.get('screen')])state.current=mode.get('screen');render();
</script></body></html>
